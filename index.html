  <style>
    /* ========== 主题变量：浅色（默认） ========== */
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --input-border: #d1d5db;
      --item-bg: #f3f5f9;
      --item-active: #e8eaf6;
      --hover: #f3f5f9;
      --selector-bg: rgba(255, 255, 255, .92);
      --btn-disabled: #c7c7d8;
      --danger-bg: #fef2f2;
    }
    /* ========== 深色模式：自动跟随系统 ========== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121317;
        --card: #1e2026;
        --text: #f1f2f6;
        --text-secondary: #a6a9b6;
        --text-muted: #8a8f9d;
        --border: #2a2d35;
        --input-border: #3a3d47;
        --item-bg: #17181d;
        --item-active: #23252d;
        --hover: #2a2c33;
        --selector-bg: rgba(30, 32, 38, .92);
        --btn-disabled: #4a4d5a;
        --danger-bg: #2a1f24;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); }

    /* ========== 地图全屏 ========== */
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* ========== 顶部状态栏（固定，不挡地图交互） ========== */
    .topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 10;
      background: #4b3fe3; display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .topbar-logo { height: 36px; pointer-events: auto; }
    /* 左上角用户中心入口（头像 + 名字） */
    .user-entry {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      pointer-events: auto; max-width: 42%;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #4b3fe3;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; border: 2px solid rgba(255,255,255,.4);
      background-size: cover; flex-shrink: 0;
    }
    .indicator {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      width: 6px; height: 6px; border-radius: 50%; background: #b6bcc6;
      transition: background .3s;
    }
    .indicator.on { background: #16a34a; }

    /* ========== HIA 圆形按键 ========== */
    .hia-btn {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.25);
      z-index: 25; overflow: hidden; padding: 0;
    }
    .hia-btn img { width: 100%; height: 100%; object-fit: cover; }
    .hia-btn:active { transform: translateX(-50%) scale(.95); }

    /* ========== 定位按钮（右下角，十字准星，同 App 风格） ========== */
    .locate-btn {
      position: absolute; right: 16px; bottom: 120px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.2);
      display: flex; align-items: center; justify-content: center;
    }
    .locate-btn:active { transform: scale(.95); }
    .locate-btn svg { width: 20px; height: 20px; }

    /* ========== 顶部用户选择器（同安卓 App） ========== */
    .user-selector {
      position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; height: 36px;
      background: var(--selector-bg); border-radius: 16px;
      padding: 3px 10px 3px 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
      cursor: pointer; z-index: 15;
    }
    .us-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: var(--item-bg);
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; background-size: cover; flex-shrink: 0; overflow: hidden;
    }
    .us-name { font-size: 13px; font-weight: 600; color: var(--text); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-selector svg { width: 18px; height: 18px; fill: var(--text-secondary); flex-shrink: 0; }
    .us-menu {
      position: absolute; top: 104px; left: 50%; transform: translateX(-50%);
      min-width: 170px; background: var(--card); border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18); z-index: 16; overflow: hidden; display: none;
    }
    .us-item {
      display: flex; align-items: center; gap: 6px; padding: 10px 14px; cursor: pointer;
    }
    .us-item:hover { background: var(--hover); }
    .us-item .us-av { width: 28px; height: 28px; border-radius: 50%; background: var(--item-bg); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background-size: cover; flex-shrink: 0; overflow: hidden; }
    .us-item .us-txt { flex: 1; text-align: center; font-size: 14px; color: var(--text); }
    .us-item .us-check { width: 28px; text-align: center; color: #4b3fe3; font-weight: 700; }

    /* ========== 遮罩 ========== */
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
      animation: fade .2s;
    }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

    /* ========== 底部面板（选择 / 分享 / 查看） ========== */
    .sheet, .panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 20px 32px;
      max-width: 440px; margin: 0 auto;
      box-shadow: 0 -4px 24px rgba(0,0,0,.1);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

    /* 选择面板 */
    .sheet-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .sheet-sub { font-size: 13px; color: var(--text-secondary); margin: 4px 0 16px; }
    .sheet-option {
      display: flex; align-items: center; padding: 16px; border-radius: 16px;
      background: var(--item-bg); margin-bottom: 12px; cursor: pointer;
    }
    .sheet-option:active { background: var(--item-active); }
    .opt-icon {
      width: 44px; height: 44px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; margin-right: 14px; flex-shrink: 0;
      font-size: 22px;
    }
    .opt-icon.share { background: rgba(75,63,227,.12); color: #4b3fe3; }
    .opt-icon.view { background: rgba(47,134,246,.12); color: #2f86f6; }
    .opt-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .opt-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* 分享 / 查看面板通用 */
    .panel-header { display: flex; align-items: center; margin-bottom: 16px; }
    .panel-title { font-size: 19px; font-weight: 700; flex: 1; color: var(--text); }
    .panel-close { font-size: 22px; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; }
    .panel-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }

    /* 分享面板 */
    .share-code {
      font-size: 36px; font-weight: 700; letter-spacing: 6px; text-align: center;
      color: #4b3fe3; padding: 8px 0; cursor: pointer;
    }
    .share-hint { font-size: 11px; color: var(--text-muted); text-align: center; }
    .share-qr { text-align: center; margin: 12px 0; }
    .share-qr img { width: 140px; height: 140px; border: 1px solid var(--border); border-radius: 8px; }
    .share-actions { display: flex; gap: 12px; margin-top: 8px; }

    /* 按钮 */
    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; background: #4b3fe3; color: #fff; cursor: pointer;
    }
    .btn-primary:disabled { background: var(--btn-disabled); cursor: not-allowed; }
    .btn-outline {
      flex: 1; padding: 12px; border: 1px solid #4b3fe3; border-radius: 12px;
      font-size: 15px; font-weight: 600; background: var(--card); color: #4b3fe3; cursor: pointer;
    }
    .btn-stop {
      width: 100%; padding: 12px; margin-top: 12px; border: 1px solid #f43f5e;
      border-radius: 12px; font-size: 15px; font-weight: 600; background: var(--card); color: #f43f5e; cursor: pointer;
    }

    /* 口令输入 */
    .code-input {
      width: 100%; padding: 14px; border: 1px solid var(--input-border); border-radius: 12px;
      font-size: 22px; font-weight: 700; letter-spacing: 4px; text-align: center;
      color: var(--text); background: var(--card); outline: none; margin: 8px 0 16px;
    }
    .code-input:focus { border-color: #4b3fe3; }

    /* 状态文字 */
    .status { margin-top: 12px; font-size: 13px; color: var(--text-secondary); text-align: center; }
    .status.on { color: #16a34a; font-weight: 600; }

    /* ========== 用户中心 ========== */
    .uc-avatar {
      width: 88px; height: 88px; border-radius: 50%; background: var(--item-bg);
      object-fit: cover; display: block; margin: 0 auto 12px;
    }
    .uc-pick { display: block; margin: 0 auto; width: auto; padding: 8px 18px; font-size: 13px; }

    /* ========== 头像裁剪 ========== */
    .crop-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 40;
      display: flex; align-items: center; justify-content: center;
    }
    .crop-box { width: 88%; max-width: 360px; background: var(--card); border-radius: 16px; padding: 16px; }
    .crop-stage {
      position: relative; width: 100%; height: 320px; background: #15151f;
      border-radius: 10px; overflow: hidden; touch-action: none;
    }
    .crop-stage img {
      position: absolute; user-select: none; -webkit-user-drag: none;
      pointer-events: none; max-width: none;
    }
    /* 选区框：白色实线边框 + 外圈柔光 + 选区外深色遮罩（主流裁剪 App 效果） */
    .crop-frame {
      position: absolute;
      border: 2px solid #fff;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,.35),
        0 0 0 9999px rgba(0,0,0,.62);
      cursor: move; touch-action: none;
    }
    .crop-frame.active {
      border-color: #fff;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,.55),
        0 0 14px rgba(75,63,227,.4),
        0 0 0 9999px rgba(0,0,0,.66);
    }
    /* 三分构图辅助网格（拖动时更清晰） */
    .crop-grid {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.26) 1px, transparent 1px) 0 33.333% / 100% 33.333%,
        linear-gradient(rgba(255,255,255,.26) 1px, transparent 1px) 0 66.666% / 100% 33.333%,
        linear-gradient(90deg, rgba(255,255,255,.26) 1px, transparent 1px) 33.333% 0 / 33.333% 100%,
        linear-gradient(90deg, rgba(255,255,255,.26) 1px, transparent 1px) 66.666% 0 / 33.333% 100%;
    }
    /* 四角加粗角标：既是视觉强调也是拖拽手柄 */
    .crop-corner { position: absolute; width: 26px; height: 26px; z-index: 2; }
    .crop-corner.tl { left: -4px; top: -4px; border-top: 4px solid #fff; border-left: 4px solid #fff; border-top-left-radius: 8px; }
    .crop-corner.tr { right: -4px; top: -4px; border-top: 4px solid #fff; border-right: 4px solid #fff; border-top-right-radius: 8px; }
    .crop-corner.bl { left: -4px; bottom: -4px; border-bottom: 4px solid #fff; border-left: 4px solid #fff; border-bottom-left-radius: 8px; }
    .crop-corner.br { right: -4px; bottom: -4px; border-bottom: 4px solid #fff; border-right: 4px solid #fff; border-bottom-right-radius: 8px; }
    .crop-tip { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; }
  /* ========== 语音对讲（内置对讲机） ========== */
    .voice-btn {
      position: absolute; right: 16px; bottom: 68px; z-index: 11;
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.2);
      display: none; align-items: center; justify-content: center;
    }
    .voice-btn.ready { display: flex; }
    .voice-btn svg { width: 22px; height: 22px; fill: #4b3fe3; }
    /* 与安卓一致：待命（含已开启但未说话）= 深浅自适应底 + 品牌紫图标；仅说话时变绿 */
    .voice-btn.hold { background: #16a34a; }
    .voice-btn.hold svg { fill: #fff; }
    .voice-btn:active { transform: scale(.95); }
    .voice-tip {
      position: absolute; right: 16px; bottom: 118px; z-index: 12; display: none;
      background: rgba(26,26,46,.8); color: #fff; font-size: 12px; line-height: 18px;
      padding: 4px 10px; border-radius: 999px; white-space: nowrap; pointer-events: none;
    }
    .voice-tip.show { display: block; }
    .voice-panel {
      position: absolute; right: 16px; bottom: 132px; z-index: 15; display: none;
      width: 250px; flex-direction: column; gap: 12px; padding: 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.22);
    }
    .voice-panel.show { display: flex; }
    .vp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .vp-title { font-size: 15px; font-weight: 700; }
    .vp-status { font-size: 12px; color: #4b3fe3; background: rgba(75,63,227,.12);
      padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .vp-close { font-size: 18px; line-height: 1; color: var(--text-muted); cursor: pointer;
      background: none; border: none; padding: 0 2px; }
    .vp-seg { display: flex; gap: 6px; background: var(--bg); border-radius: 10px; padding: 4px; }
    .vp-seg button { flex: 1; font-size: 12px; color: var(--text-muted); background: transparent;
      border: 1px solid transparent; border-radius: 8px; padding: 7px 0; cursor: pointer; }
    .vp-seg button.on { color: #4b3fe3; background: var(--card); border-color: var(--border); font-weight: 600; }
    .vp-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; gap: 8px; }
    .vp-switch { width: 40px; height: 23px; border-radius: 999px; background: var(--bg);
      border: 1px solid var(--border); position: relative; cursor: pointer; flex-shrink: 0; }
    .vp-switch i { position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .12s; }
    .vp-switch.on { background: #4b3fe3; border-color: #4b3fe3; }
    .vp-switch.on i { left: 19px; }
    .vp-remote { font-size: 12px; color: var(--text-muted); }
    .vp-disable { width: 100%; border: none; border-radius: 10px; padding: 9px 0; cursor: pointer;
      background: rgba(244,63,94,.14); color: #f43f5e; font-size: 13px; font-weight: 600; }

  </style>
</head>
<body>
  <!-- 地图 -->
  <div id="map"></div>

  <!-- 顶部状态栏 -->
  <div class="topbar">
    <div class="user-entry" id="userEntry" title="用户中心">
      <div class="user-avatar" id="userAvatar"></div>
    </div>
    <img class="topbar-logo" src="bar_logo1.png" alt="HereIAm">
    <div class="indicator" id="indicator"></div>
  </div>

  <!-- HIA 圆形按键 -->
  <button class="hia-btn" id="hiaBtn">
    <img src="hereiam_logo.png?v=20260815z" alt="HereIAm">
  </button>

  <!-- 定位按钮（回到自己位置） -->
  <button class="locate-btn" id="locateBtn" title="回到我的位置">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4b3fe3" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2" fill="#4b3fe3" stroke="none"/>
      <line x1="12" y1="1.5" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22.5"/>
      <line x1="1.5" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="22.5" y2="12"/>
    </svg>
  </button>

  <!-- 语音对讲按钮（点对点连接后才显示） -->
  <button class="voice-btn" id="voiceBtn" title="语音对讲" aria-label="语音对讲">
    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
  </button>
  <!-- 对方说话中气泡 -->
  <div class="voice-tip" id="voiceTip"></div>

  <!-- 对讲设置浮层 -->
  <div class="voice-panel" id="voicePanel">
    <div class="vp-head">
      <span class="vp-title">对讲机</span>
      <span class="vp-status" id="vStatus">语音关闭</span>
      <button class="vp-close" id="vClose" aria-label="关闭">✕</button>
    </div>
    <div class="vp-seg" id="voiceSeg">
      <button data-md="ptt" class="on">按键说话</button>
      <button data-md="continuous">免提持续</button>
    </div>
    <div class="vp-row" id="vCont">
      <span>免提持续</span>
      <div class="vp-switch"><i></i></div>
    </div>
    <div class="vp-row">
      <span>本机静音</span>
      <div class="vp-switch" id="vMute"><i></i></div>
    </div>
    <div class="vp-remote" id="vRemote">对方 · 未说话</div>
    <button class="vp-disable" id="vDisable">关闭语音</button>
  </div>

  <!-- 顶部用户选择器（同安卓 App）：选择「我」/「对端好友」使其位置保持居中 -->
  <div class="user-selector" id="userSelector" title="选择要居中跟随的人">
    <div class="us-avatar" id="usAvatar"></div>
    <div class="us-name" id="usName">我</div>
    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
  </div>
  <div class="us-menu" id="usMenu">
    <div class="us-item" id="usItemMe">
      <div class="us-av" id="usAvMe"></div>
      <div class="us-txt" id="usTxtMe">我</div>
      <div class="us-check" id="usCheckMe"></div>
    </div>
    <div id="usCoViews"></div>
    <div class="us-item" id="usItemFriend" style="display:none">
      <div class="us-av" id="usAvFriend"></div>
      <div class="us-txt" id="usTxtFriend">好友</div>
      <div class="us-check" id="usCheckFriend"></div>
    </div>
    <div class="us-item" id="usItemStop" style="display:none">
      <div class="us-av" style="background:var(--danger-bg);color:#ef4444">✕</div>
      <div class="us-txt" style="color:#ef4444">停止查看</div>
      <div class="us-check"></div>
    </div>
  </div>

  <!-- 遮罩 -->
  <div class="overlay" id="overlay" style="display:none"></div>

  <!-- 选择面板 -->
  <div class="sheet" id="sheet" style="display:none">
    <div class="sheet-title">你想做什么？</div>
    <div class="sheet-sub">选择一个操作开始使用</div>
    <div class="sheet-option" id="optShare">
      <div class="opt-icon share">↗</div>
      <div>
        <div class="opt-title">分享我的位置</div>
        <div class="opt-sub">生成口令，让好友实时查看你的位置</div>
      </div>
    </div>
    <div class="sheet-option" id="optView">
      <div class="opt-icon view">◎</div>
      <div>
        <div class="opt-title">查看他人位置</div>
        <div class="opt-sub">输入口令，查看好友的实时位置</div>
      </div>
    </div>
  </div>

  <!-- 分享面板 -->
  <div class="panel" id="sharePanel" style="display:none">
    <div class="panel-header">
      <span class="panel-title">分享我的位置</span>
      <span class="panel-close" id="shareClose">✕</span>
    </div>
    <div class="panel-label">分享口令（点击可复制）</div>
    <div class="share-code" id="code">------</div>
    <div class="share-hint">把链接或口令发给好友</div>
    <div class="share-qr"><img id="qrcode" alt="二维码"></div>
    <div class="share-actions">
      <button class="btn-outline" id="copyBtn">复制口令</button>
      <button class="btn-outline" id="linkBtn">复制链接</button>
    </div>
    <div class="status" id="status"></div>
    <button class="btn-stop" id="stopBtn" style="display:none">停止共享</button>
  </div>

  <!-- 查看面板 -->
  <div class="panel" id="viewPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-title">查看他人位置</span>
      <span class="panel-close" id="viewClose">✕</span>
    </div>
    <!-- 正在查看：显示口令 + 停止 -->
    <div id="viewingSection" style="display:none">
      <div class="panel-label">正在查看口令</div>
      <div class="share-code" id="viewingCode">------</div>
      <div class="status" id="viewingStatus"></div>
      <button class="btn-stop" id="stopViewBtn">停止查看</button>
    </div>
    <!-- 输入口令 -->
    <div id="inputSection">
      <div class="panel-label">请输入好友分享的口令</div>
      <input class="code-input" id="viewCode" type="tel" maxlength="6" placeholder="6 位口令">
      <button class="btn-primary" id="joinBtn" disabled>开始查看</button>
      <div class="status" id="viewStatus"></div>
    </div>
  </div>

  <!-- 用户中心 -->
  <div class="overlay" id="ucOverlay" style="display:none"></div>
  <div class="panel" id="ucPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-title">用户中心</span>
      <span class="panel-close" id="ucClose">✕</span>
    </div>
    <img class="uc-avatar" id="ucAvatarPreview" alt="头像" style="display:none">
    <label class="btn-outline uc-pick" style="text-align:center">选择头像<input type="file" id="ucAvatarInput" accept="image/*" style="display:none"></label>
    <div class="panel-label" style="margin-top:16px">用户名（12 字以内，会显示给好友）</div>
    <input class="code-input" id="ucName" maxlength="12" placeholder="请输入用户名">
    <button class="btn-primary" id="ucSave">保存</button>
  </div>

  <!-- 头像裁剪 -->
  <div class="crop-overlay" id="cropOverlay" style="display:none">
    <div class="crop-box">
      <div class="panel-header" style="margin-bottom:10px">
        <span class="panel-title">调整头像</span>
      </div>
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" alt="头像">
        <div class="crop-frame" id="cropFrame">
          <div class="crop-grid"></div>
          <span class="crop-corner tl"></span>
          <span class="crop-corner tr"></span>
          <span class="crop-corner bl"></span>
          <span class="crop-corner br"></span>
        </div>
      </div>
      <div class="crop-tip">拖动选区移动 · 拖四角角标调整大小</div>
      <div style="display:flex;gap:12px;margin-top:12px">
        <button class="btn-outline" id="cropCancel" style="flex:1">取消</button>
        <button class="btn-primary" id="cropConfirm" style="flex:1">确定</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.ably.com/lib/ably.min-1.2.41.js"></script>
  <script src="config.js?v=20260816a"></script>
  <script src="signaling.js?v=20260816b"></script>
  <script src="user.js?v=20260816a"></script>
  <script src="voice.js?v=20260826c"></script>
  <script src="index.js?v=20260827b"></script>
</body>
</html>

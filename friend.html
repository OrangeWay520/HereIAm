  <style>
    /* ========== 主题变量：浅色（默认） ========== */
    :root {
      --bg: #f3f5f9; --card: #ffffff; --text: #1a1a2e; --text-secondary: #6b7280;
      --text-muted: #9ca3af; --border: #e5e7eb; --input-border: #d1d5db;
      --item-bg: #f3f5f9;
    }
    /* ========== 深色模式：自动跟随系统 ========== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121317; --card: #1e2026; --text: #f1f2f6; --text-secondary: #a6a9b6;
        --text-muted: #8a8f9d; --border: #2a2d35; --input-border: #3a3d47;
        --item-bg: #17181d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    }
    .top {
      background: #4b3fe3; color: #fff; padding: 14px 16px; display: flex;
      align-items: center; justify-content: space-between; gap: 8px;
    }
    .top .t { font-size: 15px; font-weight: 600; }
    /* 左上角用户中心入口 */
    .user-entry {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      max-width: 42%; min-width: 0;
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--card); color: #4b3fe3;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; border: 2px solid rgba(255,255,255,.4);
      background-size: cover; flex-shrink: 0;
    }
    .status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
    .status.on { background: #22c55e; }
    #map { flex: 1; min-height: 60vh; width: 100%; }
    .addr {
      position: fixed; left: 12px; right: 12px; bottom: 16px; background: var(--card);
      border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 20px rgba(0,0,0,.12);
      font-size: 13px; color: var(--text);
    }
    .addr b { color: #4b3fe3; }
    /* 「定位好友」悬浮按钮：类似地图 App 的定位按钮 */
    .loc-btn {
      position: fixed; right: 16px; bottom: 84px; width: 48px; height: 48px;
      border-radius: 50%; border: none; background: var(--card); cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.18); display: flex;
      align-items: center; justify-content: center; z-index: 999;
    }
    .loc-btn svg { width: 22px; height: 22px; fill: #4b3fe3; }
    .loc-btn.active { background: #4b3fe3; }
    .loc-btn.active svg { fill: #fff; }
    .loc-tip {
      position: fixed; right: 16px; bottom: 140px; background: rgba(0,0,0,.7);
      color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px;
      display: none; z-index: 999; max-width: 200px;
    }
    .loc-tip.show { display: block; }
    /* ========== HIA 圆形按键（同安卓 App，点击可退出位置共享）========== */
    .hia-btn {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
      width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.25);
      z-index: 15; overflow: hidden; padding: 0;
    }
    .hia-btn img { width: 100%; height: 100%; object-fit: cover; }
    .hia-btn:active { transform: translateX(-50%) scale(.95); }
    .btn-stop {
      width: 100%; padding: 12px; margin-top: 12px; border: 1px solid #f43f5e;
      border-radius: 12px; font-size: 15px; font-weight: 600; background: var(--card);
      color: #f43f5e; cursor: pointer;
    }
    /* ========== 用户中心 ========== */
    .panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 20px 32px;
      max-width: 440px; margin: 0 auto;
      box-shadow: 0 -4px 24px rgba(0,0,0,.1);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
    .panel-header { display: flex; align-items: center; margin-bottom: 16px; }
    .panel-title { font-size: 19px; font-weight: 700; flex: 1; color: var(--text); }
    .panel-close { font-size: 22px; color: var(--text-secondary); cursor: pointer; padding: 4px 8px; }
    .panel-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
      animation: fade .2s;
    }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .uc-avatar {
      width: 88px; height: 88px; border-radius: 50%; background: var(--item-bg);
      object-fit: cover; display: block; margin: 0 auto 12px;
    }
    .uc-pick { display: block; margin: 0 auto; width: auto; padding: 8px 18px; font-size: 13px; }
    .btn-outline {
      padding: 12px; border: 1px solid #4b3fe3; border-radius: 12px;
      font-size: 15px; font-weight: 600; background: var(--card); color: #4b3fe3; cursor: pointer;
    }
    .btn-primary {
      width: 100%; padding: 14px; margin-top: 12px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; background: #4b3fe3; color: #fff; cursor: pointer;
    }
    .code-input {
      width: 100%; padding: 14px; border: 1px solid var(--input-border); border-radius: 12px;
      font-size: 22px; font-weight: 700; letter-spacing: 4px; text-align: center;
      color: var(--text); background: var(--card); outline: none; margin: 8px 0 16px;
    }
    .code-input:focus { border-color: #4b3fe3; }
    /* ========== 头像裁剪 ========== */
    .crop-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40;
      display: flex; align-items: center; justify-content: center;
    }
    .crop-box { width: 88%; max-width: 360px; background: var(--card); border-radius: 16px; padding: 16px; }
    .crop-stage {
      position: relative; width: 100%; height: 320px; background: #15151f;
      border-radius: 10px; overflow: hidden; touch-action: none;
    }
    .crop-stage img {
      position: absolute; user-select: none; -webkit-user-drag: none;
      pointer-events: none; max-width: none;
    }
    /* 选区框：白色实线边框 + 外圈柔光 + 选区外深色遮罩（主流裁剪 App 效果） */
    .crop-frame {
      position: absolute;
      border: 2px solid #fff;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,.35),
        0 0 0 9999px rgba(0,0,0,.62);
      cursor: move; touch-action: none;
    }
    .crop-frame.active {
      border-color: #fff;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,.55),
        0 0 14px rgba(75,63,227,.4),
        0 0 0 9999px rgba(0,0,0,.66);
    }
    /* 三分构图辅助网格（拖动时更清晰） */
    .crop-grid {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.26) 1px, transparent 1px) 0 33.333% / 100% 33.333%,
        linear-gradient(rgba(255,255,255,.26) 1px, transparent 1px) 0 66.666% / 100% 33.333%,
        linear-gradient(90deg, rgba(255,255,255,.26) 1px, transparent 1px) 33.333% 0 / 33.333% 100%,
        linear-gradient(90deg, rgba(255,255,255,.26) 1px, transparent 1px) 66.666% 0 / 33.333% 100%;
    }
    /* 四角加粗角标：既是视觉强调也是拖拽手柄 */
    .crop-corner { position: absolute; width: 26px; height: 26px; z-index: 2; }
    .crop-corner.tl { left: -4px; top: -4px; border-top: 4px solid #fff; border-left: 4px solid #fff; border-top-left-radius: 8px; }
    .crop-corner.tr { right: -4px; top: -4px; border-top: 4px solid #fff; border-right: 4px solid #fff; border-top-right-radius: 8px; }
    .crop-corner.bl { left: -4px; bottom: -4px; border-bottom: 4px solid #fff; border-left: 4px solid #fff; border-bottom-left-radius: 8px; }
    .crop-corner.br { right: -4px; bottom: -4px; border-bottom: 4px solid #fff; border-right: 4px solid #fff; border-bottom-right-radius: 8px; }
    .crop-tip { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="top">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <div class="user-entry" id="userEntry" title="用户中心">
        <div class="user-avatar" id="userAvatar"></div>
      </div>
      <span class="t">好友位置</span>
    </div>
    <span class="status" id="status">等待连接…</span>
  </div>
  <div id="map"><p style="padding:20px;color:var(--text-muted)">地图加载中…</p></div>
  <div class="addr" id="addr">好友位置将在这里显示</div>
  <button class="loc-btn" id="locBtn" title="定位好友">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
  </button>
  <div class="loc-tip" id="locTip">已跟随好友，地图将随距离自动缩放</div>

  <!-- HIA 圆形按键（同安卓 App，点击弹出退出位置共享面板） -->
  <button class="hia-btn" id="hiaBtn" title="位置共享">
    <img src="hereiam_logo.png" alt="HereIAm">
  </button>

  <!-- 退出位置共享面板 -->
  <div class="overlay" id="exitOverlay" style="display:none"></div>
  <div class="panel" id="exitPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-title">位置共享</span>
      <span class="panel-close" id="exitClose">✕</span>
    </div>
    <div class="panel-label">正在查看好友位置</div>
    <div class="status" id="exitStatus">连接中…</div>
    <button class="btn-stop" id="exitBtn">退出位置共享</button>
  </div>

  <!-- 用户中心 -->
  <div class="overlay" id="ucOverlay" style="display:none"></div>
  <div class="panel" id="ucPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-title">用户中心</span>
      <span class="panel-close" id="ucClose">✕</span>
    </div>
    <img class="uc-avatar" id="ucAvatarPreview" alt="头像" style="display:none">
    <label class="btn-outline uc-pick" style="text-align:center">选择头像<input type="file" id="ucAvatarInput" accept="image/*" style="display:none"></label>
    <div class="panel-label" style="margin-top:16px">用户名（12 字以内，会显示给好友）</div>
    <input class="code-input" id="ucName" maxlength="12" placeholder="请输入用户名">
    <button class="btn-primary" id="ucSave">保存</button>
  </div>

  <!-- 头像裁剪 -->
  <div class="crop-overlay" id="cropOverlay" style="display:none">
    <div class="crop-box">
      <div class="panel-header" style="margin-bottom:10px">
        <span class="panel-title">调整头像</span>
      </div>
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" alt="头像">
        <div class="crop-frame" id="cropFrame">
          <div class="crop-grid"></div>
          <span class="crop-corner tl"></span>
          <span class="crop-corner tr"></span>
          <span class="crop-corner bl"></span>
          <span class="crop-corner br"></span>
        </div>
      </div>
      <div class="crop-tip">拖动选区移动 · 拖四角角标调整大小</div>
      <div style="display:flex;gap:12px;margin-top:12px">
        <button class="btn-outline" id="cropCancel" style="flex:1">取消</button>
        <button class="btn-primary" id="cropConfirm" style="flex:1">确定</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.ably.com/lib/ably.min-1.2.41.js"></script>
  <!-- 加版本号：防止浏览器/CDN 缓存旧版 JS，更新后强制重新加载 -->
  <script src="config.js?v=20260815x"></script>
  <script src="signaling.js?v=20260815x"></script>
  <script src="user.js?v=20260815x"></script>
  <script src="friend.js?v=20260815x"></script>
</body>
</html>

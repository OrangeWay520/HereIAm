  <style>
    /* ========== 主题变量：浅色（默认） ========== */
    :root {
      --bg: #f3f5f9; --card: #ffffff; --text: #1a1a2e; --text-secondary: #6b7280;
      --text-muted: #9ca3af; --border: #e5e7eb; --input-border: #d1d5db;
      --btn-disabled: #c7c7d8;
    }
    /* ========== 深色模式：自动跟随系统 ========== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121317; --card: #1e2026; --text: #f1f2f6; --text-secondary: #a6a9b6;
        --text-muted: #8a8f9d; --border: #2a2d35; --input-border: #3a3d47;
        --btn-disabled: #4a4d5a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh;
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 20px; max-width: 420px;
      margin: 0 auto 16px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: #f43f5e; display: inline-block; }
    .code { font-size: 34px; font-weight: 700; letter-spacing: 4px; text-align: center; color: #4b3fe3; margin: 12px 0; }
    .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    input[type=text] { width: 100%; padding: 10px; border: 1px solid var(--input-border); border-radius: 8px; font-size: 14px; background: var(--card); color: var(--text); }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px;
      background: #4b3fe3; color: #fff; cursor: pointer; font-weight: 600;
    }
    .btn:disabled { background: var(--btn-disabled); cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; color: var(--text-secondary); text-align: center; }
    .status.on { color: #16a34a; font-weight: 600; }
    .qr { text-align: center; margin-top: 12px; }
    .qr img { width: 140px; height: 140px; border: 1px solid var(--border); border-radius: 8px; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="pulse"></span>HereIAm · 分享位置</h1>
    <p class="hint">在浏览器打开本页（建议手机浏览器），一键开始分享实时位置</p>
    <div class="label">本次分享口令</div>
    <div class="code" id="code">------</div>
    <div class="label">把下面的链接（或口令）发给好友</div>
    <input type="text" id="link" readonly>
    <div class="qr"><img id="qrcode" alt="分享二维码"></div>
    <div style="height:12px"></div>
    <button class="btn" id="start">开始分享实时位置</button>
    <div class="status" id="status">点击上方按钮开始</div>
  </div>

  <script src="https://cdn.ably.com/lib/ably.min-1.2.41.js"></script>
  <script src="config.js?v=20260816a"></script>

</body>
